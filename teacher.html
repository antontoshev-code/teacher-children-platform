<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Профил на педагог – Слънчев мост</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="main" class="wrap">
  <p class="crumbs"><a href="index.html">Начало</a> › <a href="results.html">Предложения</a> › <span id="cn"></span></p>
  <div id="box"></div>
</main>
<script src="js/data.js"></script>
<script src="js/layout.js"></script>
<script>
const id=+new URLSearchParams(location.search).get("id")||1;
const t=TEACHERS.find(x=>x.id===id)||TEACHERS[0];
document.getElementById("cn").textContent=t.name;
document.title=t.name+" – профил – Слънчев мост";
const need=Object.entries(t.exp).filter(([k,v])=>v>0).map(([k,v])=>`<li>${NEEDS[k]}: ${v} ${v==1?"година":"години"} опит</li>`).join("");
const age=Object.entries(t.ageExp).map(([k,v])=>`<li>${bandLabel[k]}: ${v} ${v==1?"година":"години"}</li>`).join("");
const dayrow=Object.entries(TIMES).map(([k,v])=>`<tr><th scope="row">${v}</th><td>${t.times.includes(k)?"Свободен":"Не"}</td></tr>`).join("");
const ratingLine=t.reviews
  ? `<p class="rate big"><span aria-hidden="true">★</span> ${String(t.rating).replace(".",",")} от 5 <span class="muted">(${t.reviews} ${t.reviews==1?"отзив":"отзива"})</span></p>`
  : `<p class="rate big">Нов профил, още без отзиви</p>`;
document.getElementById("box").innerHTML=`
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
<div>
  <div class="teacher" style="grid-template-columns:96px 1fr"><div class="avatar" aria-hidden="true">${t.name.split(" ").map(w=>w[0]).join("")}</div>
  <div><h1 style="margin-bottom:.2rem">${t.name}</h1>${ratingLine}<p>${t.city} · ${t.subjects.map(s=>SUBJECTS[s]).join(", ")}</p>
  ${t.verified?'<span class="chip ok">Профилът е проверен от екипа</span>':'<span class="chip">Профилът още не е проверен</span>'}</div></div>
  <h2>За мен</h2><p>${t.bio}</p>
  <h2>Нещо, което е хубаво да знаеш за мен</h2><p>${ABOUT[t.id]||"Още няма текст."}</p>
  <h2>Опит с потребности</h2><ul>${need||"<li>Още няма посочен опит.</li>"}</ul>
  <h2>Опит по възрастови групи</h2><ul>${age}</ul>
  <h2>Обучения и квалификация</h2><ul>${t.training.map(x=>`<li>${x}</li>`).join("")}</ul>
  <h2>Отзиви</h2>
  ${t.reviews?`<blockquote class="card" style="margin:0 0 1rem"><em>Пример за отзив: „Синът ни вече очаква уроците. Всичко е с ясен план.“</em><br><small>Родител, отзивът е примерен</small></blockquote>`:"<p>Още няма отзиви. След първия пробен урок родителите могат да оставят отзив.</p>"}
</div>
<aside><div class="card" style="position:sticky;top:10px">
  <p class="price">${t.price} € <small style="font-weight:400">на час</small></p>
  <p>Формат: ${t.formats.map(f=>FORMATS[f]).join(", ")}<br>Отговаря обикновено до ${t.respHours} ч.<br>Класове: ${classLabel(t.ageFrom)} – ${classLabel(t.ageTo)}</p>
  <table class="sched"><caption class="sr">Свободни часове</caption><tbody>${dayrow}</tbody></table>
  <p style="margin-top:1rem"><a class="btn yellow" href="contact.html?id=${t.id}">Изпрати заявка за пробен урок</a></p>
  <p class="hint">Не показваме телефон и имейл. Първо се свързвате през платформата.</p>
</div></aside></div>
<div class="next"><a class="btn alt" href="results.html">Към предложенията</a> <a class="btn alt" href="questionnaire.html">Получи персонални предложения</a></div>`;
</script>
</body>
</html>
